<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Indian Sign Language (ISL) Learning Corner</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/style.css">
  <style>
    .learning-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 18px 24px;
      background: var(--bg-panel);
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-lg);
    }
    .learning-controls {
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      padding: 14px 18px;
      background: var(--bg-panel);
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-md);
    }
    .filter-group {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
    }
    .filter-btn {
      padding: 6px 12px;
      background: #151922;
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-sm);
      font-size: 0.78rem;
      font-weight: 500;
      color: var(--text-secondary);
      cursor: pointer;
      transition: all 0.15s ease;
    }
    .filter-btn:hover {
      background: #1c2230;
      color: var(--text-primary);
    }
    .filter-btn.active {
      background: #1f2738;
      border-color: var(--border-active);
      color: var(--text-primary);
      font-weight: 600;
    }
    .search-input {
      max-width: 260px;
      width: 100%;
      padding: 7px 12px;
      background: var(--bg-input);
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-sm);
      color: var(--text-primary);
      font-size: 0.82rem;
      outline: none;
    }
    .search-input:focus {
      border-color: var(--border-focus);
    }
    .alphabet-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
      gap: 16px;
    }
    .alpha-card {
      background: var(--bg-panel);
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-md);
      overflow: hidden;
      display: flex;
      flex-direction: column;
      transition: transform 0.15s ease, border-color 0.15s ease;
    }
    .alpha-card:hover {
      border-color: #2e3748;
      transform: translateY(-2px);
    }
    .alpha-card-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 12px 16px;
      background: #0f1218;
      border-bottom: 1px solid var(--border-subtle);
    }
    .letter-badge-group {
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .letter-display {
      font-family: var(--font-mono);
      font-size: 1.6rem;
      font-weight: 700;
      color: #60a5fa;
      line-height: 1;
    }
    .type-badge {
      font-size: 0.65rem;
      font-weight: 600;
      text-transform: uppercase;
      padding: 2px 6px;
      border-radius: var(--radius-sm);
      background: #19202e;
      border: 1px solid var(--border-subtle);
      color: var(--text-secondary);
    }
    .type-badge.vowel {
      background: rgba(16, 185, 129, 0.1);
      border-color: rgba(16, 185, 129, 0.3);
      color: var(--accent-green);
    }
    .alpha-card-body {
      padding: 16px;
      display: flex;
      gap: 14px;
      align-items: flex-start;
      flex: 1;
    }
    .alpha-img-container {
      width: 110px;
      height: 110px;
      background: #090b0e;
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-sm);
      overflow: hidden;
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .alpha-img-container img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      transition: transform 0.2s ease;
    }
    .alpha-img-container:hover img {
      transform: scale(1.08);
    }
    .alpha-info {
      display: flex;
      flex-direction: column;
      gap: 6px;
      flex: 1;
    }
    .alpha-posture-title {
      font-size: 0.78rem;
      font-weight: 600;
      color: var(--text-primary);
      text-transform: uppercase;
      letter-spacing: 0.03em;
    }
    .alpha-desc {
      font-size: 0.78rem;
      color: var(--text-muted);
      line-height: 1.4;
    }
    .alpha-card-footer {
      padding: 10px 16px;
      background: #0f1218;
      border-top: 1px solid var(--border-subtle);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
  </style>
</head>
<body>
  <div class="app-container">
    <!-- Header -->
    <header class="learning-header">
      <div class="header-left">
        <div class="brand-mark">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"/>
            <path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"/>
          </svg>
        </div>
        <div>
          <div class="brand-title-row">
            <h1 class="logo-title">ISL Learning Corner</h1>
            <span class="badge-tag">A to Z Reference</span>
          </div>
          <p class="logo-subtitle">Authentic Indian Sign Language Visual Posture Guide &bull; 26 Alphabets</p>
        </div>
      </div>
      <div class="header-actions">
        <a href="/" class="btn btn-primary" style="text-decoration: none;">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="15 18 9 12 15 6"/></svg>
          Live Interpreter
        </a>
      </div>
    </header>

    <!-- Controls Bar -->
    <section class="learning-controls">
      <div class="filter-group">
        <button class="filter-btn active" data-filter="all">All Alphabets (26)</button>
        <button class="filter-btn" data-filter="vowel">Vowels (A, E, I, O, U)</button>
        <button class="filter-btn" data-filter="1h">1-Handed Signs</button>
        <button class="filter-btn" data-filter="2h">2-Handed Signs</button>
      </div>
      <input type="text" id="searchLetterInput" class="search-input font-mono" placeholder="Filter by letter (e.g. A, B)...">
    </section>

    <!-- 26 Alphabet Cards Grid -->
    <main class="alphabet-grid" id="alphabetGrid">
      <!-- Dynamically generated 26 alphabet cards -->
    </main>
  </div>

  <script>
    // Authentic ISL Alphabet Guide with Handedness & Posture Information
    const ISL_DATA = [
      {
        letter: 'A',
        isVowel: true,
        type: '2-Handed / 1-Handed',
        posture: 'Thumb Tap / Upright Fist',
        desc: 'Dominant index finger points to the tip of non-dominant thumb. Alternatively formed as a closed fist with thumb upright alongside index.'
      },
      {
        letter: 'B',
        isVowel: false,
        type: '2-Handed / 1-Handed',
        posture: 'Dual Circles / Flat Palm',
        desc: 'Both hands form circles touching at index and thumbs like eyeglasses, or four fingers extended vertically with thumb folded across palm.'
      },
      {
        letter: 'C',
        isVowel: false,
        type: '1-Handed',
        posture: 'Curved Arc',
        desc: 'Dominant hand curves fingers and thumb outward forming a distinct semi-circular "C" shape facing outward.'
      },
      {
        letter: 'D',
        isVowel: false,
        type: '2-Handed / 1-Handed',
        posture: 'Upright Index & Touch',
        desc: 'Dominant index finger points straight up while non-dominant hand forms an arc touching the index tip, or index up with thumb touching fingertips in a loop.'
      },
      {
        letter: 'E',
        isVowel: true,
        type: '2-Handed / 1-Handed',
        posture: 'Index Tap / Curled Claw',
        desc: 'Dominant index finger touches the tip of non-dominant index finger. Alternatively, all fingertips curl inward against the thumb tip.'
      },
      {
        letter: 'F',
        isVowel: false,
        type: '2-Handed / 1-Handed',
        posture: 'Crossed Fingers / OK Loop',
        desc: 'Two fingers (index and middle) of dominant hand placed across the two fingers of non-dominant hand, or index and thumb touching in an OK pinch with other fingers upright.'
      },
      {
        letter: 'G',
        isVowel: false,
        type: '2-Handed / 1-Handed',
        posture: 'Stacked Fists / Caliper',
        desc: 'Both closed fists placed together one on top of the other, or index finger and thumb extended horizontally forward like a small caliper.'
      },
      {
        letter: 'H',
        isVowel: false,
        type: '2-Handed / 1-Handed',
        posture: 'Palm Sweep / Parallel Pair',
        desc: 'Dominant flat hand sweeps smoothly across flat non-dominant palm, or index and middle fingers extended horizontally together.'
      },
      {
        letter: 'I',
        isVowel: true,
        type: '2-Handed / 1-Handed',
        posture: 'Middle Tap / Pinky Up',
        desc: 'Dominant index finger touches the tip of non-dominant middle finger. Alternatively, pinky finger held vertically upright from a closed fist.'
      },
      {
        letter: 'J',
        isVowel: false,
        type: '2-Handed / 1-Handed',
        posture: 'Hook Stroke / Pinky Curve',
        desc: 'Dominant index finger traces the curved hook of the letter "J" on non-dominant palm, or pinky traces a J curve in the air.'
      },
      {
        letter: 'K',
        isVowel: false,
        type: '2-Handed / 1-Handed',
        posture: 'Hooked Angle / V-Thumb',
        desc: 'Dominant index finger hooked at an angle over non-dominant index finger forming a "K", or index upright with middle forward and thumb wedged between.'
      },
      {
        letter: 'L',
        isVowel: false,
        type: '1-Handed',
        posture: 'Right Angle L-Shape',
        desc: 'Dominant index finger pointing straight up and thumb extended outward at a 90-degree angle, with other three fingers curled tightly into palm.'
      },
      {
        letter: 'M',
        isVowel: false,
        type: '2-Handed / 1-Handed',
        posture: 'Three Fingers on Palm',
        desc: 'Three fingers (index, middle, ring) of dominant hand rested on the non-dominant palm, or draped over the thumb in a closed fist.'
      },
      {
        letter: 'N',
        isVowel: false,
        type: '2-Handed / 1-Handed',
        posture: 'Two Fingers on Palm',
        desc: 'Two fingers (index and middle) of dominant hand rested on the non-dominant palm, or draped over the thumb in a closed fist.'
      },
      {
        letter: 'O',
        isVowel: true,
        type: '2-Handed / 1-Handed',
        posture: 'Ring Tap / O-Circle',
        desc: 'Dominant index finger touches the tip of non-dominant ring finger. Alternatively, all fingertips and thumb touch forming a circular "O".'
      },
      {
        letter: 'P',
        isVowel: false,
        type: '2-Handed / 1-Handed',
        posture: 'Index Loop Touch',
        desc: 'Dominant index and thumb form a loop touching the top of non-dominant index finger, or K-shape pointing downwards.'
      },
      {
        letter: 'Q',
        isVowel: false,
        type: '2-Handed / 1-Handed',
        posture: 'Circle Hook / Downward Pinch',
        desc: 'Dominant index and thumb loop hooked around non-dominant index, or index and thumb pointing downwards in a pinch.'
      },
      {
        letter: 'R',
        isVowel: false,
        type: '1-Handed / 2-Handed',
        posture: 'Crossed Fingers',
        desc: 'Dominant index and middle fingers crossed tightly over each other, or dominant index rested across non-dominant palm.'
      },
      {
        letter: 'S',
        isVowel: false,
        type: '2-Handed / 1-Handed',
        posture: 'Hooked Pinkies / Fist',
        desc: 'Dominant pinky finger hooked with non-dominant pinky, or closed fist with thumb wrapped across the front of the curled fingers.'
      },
      {
        letter: 'T',
        isVowel: false,
        type: '2-Handed / 1-Handed',
        posture: 'Edge Touch / Thumb Tuck',
        desc: 'Dominant index touches the lower edge of non-dominant index, or thumb tucked between index and middle fingers in a fist.'
      },
      {
        letter: 'U',
        isVowel: true,
        type: '2-Handed / 1-Handed',
        posture: 'Pinky Tap / Glued Index-Middle',
        desc: 'Dominant index finger touches the tip of non-dominant pinky finger. Alternatively, index and middle fingers held straight up together.'
      },
      {
        letter: 'V',
        isVowel: false,
        type: '1-Handed',
        posture: 'Peace / V-Spread',
        desc: 'Index and middle fingers held straight up and spread apart in a sharp "V" shape, with thumb holding ring and pinky into palm.'
      },
      {
        letter: 'W',
        isVowel: false,
        type: '1-Handed / 2-Handed',
        posture: 'Three Finger Spread',
        desc: 'Three fingers (index, middle, ring) held straight up and spread apart in a "W" formation, or interlocking fingers of both hands.'
      },
      {
        letter: 'X',
        isVowel: false,
        type: '2-Handed / 1-Handed',
        posture: 'Crossed Index / Hook',
        desc: 'Both index fingers crossed to form an "X", or dominant index finger curled into a single hook shape from a closed fist.'
      },
      {
        letter: 'Y',
        isVowel: false,
        type: '2-Handed / 1-Handed',
        posture: 'Thumb-Index Crook / Shaka',
        desc: 'Dominant index rested in the crook between non-dominant thumb and index, or thumb and pinky extended wide outward.'
      },
      {
        letter: 'Z',
        isVowel: false,
        type: '2-Handed / 1-Handed',
        posture: 'Z-Trace / Angled Palm',
        desc: 'Dominant index finger traces a zigzag "Z" pattern in the air or touches across non-dominant palm held horizontally.'
      }
    ];

    const grid = document.getElementById('alphabetGrid');
    const searchInput = document.getElementById('searchLetterInput');
    const filterBtns = document.querySelectorAll('.filter-btn');

    let currentFilter = 'all';

    function renderCards(filter = 'all', query = '') {
      grid.innerHTML = '';
      const q = query.trim().toUpperCase();

      const filtered = ISL_DATA.filter(item => {
        // Filter match
        let passFilter = true;
        if (filter === 'vowel') passFilter = item.isVowel;
        else if (filter === '1h') passFilter = item.type.includes('1-Handed');
        else if (filter === '2h') passFilter = item.type.includes('2-Handed');

        // Query match
        let passQuery = true;
        if (q) {
          passQuery = item.letter.includes(q) || item.posture.toUpperCase().includes(q) || item.desc.toUpperCase().includes(q);
        }

        return passFilter && passQuery;
      });

      if (filtered.length === 0) {
        grid.innerHTML = '<div style="grid-column: 1/-1; text-align: center; padding: 40px; color: var(--text-muted); font-size: 0.9rem;">No alphabets match your filter or search query.</div>';
        return;
      }

      filtered.forEach(item => {
        const card = document.createElement('div');
        card.className = 'alpha-card';
        card.innerHTML = `
          <div class="alpha-card-header">
            <div class="letter-badge-group">
              <span class="letter-display">${item.letter}</span>
              <span class="type-badge ${item.isVowel ? 'vowel' : ''}">${item.isVowel ? 'Vowel' : 'Consonant'}</span>
              <span class="type-badge">${item.type}</span>
            </div>
          </div>
          <div class="alpha-card-body">
            <div class="alpha-img-container">
              <img src="/static/learning_signs/${item.letter}.jpg" alt="ISL Sign ${item.letter}" loading="lazy" onerror="this.onerror=null; this.src='/static/placeholder_hand.png';">
            </div>
            <div class="alpha-info">
              <div class="alpha-posture-title">${item.posture}</div>
              <div class="alpha-desc">${item.desc}</div>
            </div>
          </div>
          <div class="alpha-card-footer">
            <button class="btn btn-secondary btn-speak" data-letter="${item.letter}" data-desc="${item.desc}">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><path d="M19.07 4.93a10 10 0 0 1 0 14.14"/></svg>
              Pronounce
            </button>
            <a href="/" class="btn btn-primary" style="text-decoration: none; padding: 5px 12px; font-size: 0.78rem;">
              Practice Live
            </a>
          </div>
        `;
        grid.appendChild(card);
      });

      // Attach speech synthesis listeners
      document.querySelectorAll('.btn-speak').forEach(btn => {
        btn.addEventListener('click', () => {
          const letter = btn.dataset.letter;
          speakText(`Alphabet ${letter}. ${btn.dataset.desc}`);
        });
      });
    }

    function speakText(text) {
      if ('speechSynthesis' in window) {
        window.speechSynthesis.cancel();
        const utterance = new SpeechSynthesisUtterance(text);
        utterance.rate = 1.0;
        utterance.pitch = 1.0;
        utterance.lang = 'en-IN';
        window.speechSynthesis.speak(utterance);
      }
    }

    // Filter Button Clicks
    filterBtns.forEach(btn => {
      btn.addEventListener('click', () => {
        filterBtns.forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        currentFilter = btn.dataset.filter;
        renderCards(currentFilter, searchInput.value);
      });
    });

    // Search Input
    searchInput.addEventListener('input', (e) => {
      renderCards(currentFilter, e.target.value);
    });

    // Initial Render
    renderCards();
  </script>
</body>
</html>
